name: Review authorized display feeds
on:
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: display-import-review
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-feeds.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: display-import-review
          path: import-output/
          retention-days: 7
          if-no-files-found: error
