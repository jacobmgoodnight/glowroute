  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffd46b"/><stop offset="1" stop-color="#f9a43a"/></linearGradient>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#52667e" stroke-width="1" opacity=".12"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
</defs>
<rect width="1200" height="620" fill="url(#bg)"/>
<circle cx="1120" cy="40" r="215" fill="#274666" opacity=".18"/>
<circle cx="35" cy="620" r="270" fill="#126659" opacity=".10"/>
<g transform="translate(40 30)" font-family="Arial, Helvetica, sans-serif">
