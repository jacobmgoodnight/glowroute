  <rect x="0" y="0" width="1120" height="62" rx="24" fill="#1c2b40"/>
  <path d="M0 39H1120V62H0Z" fill="#1c2b40"/>
  <circle cx="32" cy="31" r="6" fill="#fb6d64"/><circle cx="52" cy="31" r="6" fill="#f7c65a"/><circle cx="72" cy="31" r="6" fill="#4ed5a1"/>
  <text x="101" y="39" font-size="23" font-weight="700" fill="#f8fafc">GlowRoute</text>
  <text x="1090" y="37" text-anchor="end" font-size="12" letter-spacing="2" fill="#a9bed5">HOLIDAY DRIVE PLANNER</text>
  <g transform="translate(24 86)">
    <rect width="379" height="450" rx="18" fill="#19273a" stroke="#40536a"/>
    <text x="24" y="37" font-size="12" font-weight="700" letter-spacing="2" fill="#62ddaf">PLAN YOUR DRIVE</text>
    <text x="24" y="81" font-size="28" font-weight="700" fill="#f6f8fc">More lights.</text>
    <text x="24" y="114" font-size="28" font-weight="700" fill="#f6f8fc">Less backtracking.</text>
