    <circle cx="44" cy="309" r="6" fill="#59d9a9"/><text x="60" y="315" font-size="15" fill="#f0f6fb">Your starting point</text>
    <text x="24" y="361" font-size="13" font-weight="700" fill="#cbd7e6">YOUR ROUTE</text>
