<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Illustrated GlowRoute holiday display tour planning</title>
<desc id="desc">A stylized illustration of GlowRoute with a holiday drive planner, selectable displays, and an optimized route on a map. This is a feature illustration, not a screenshot.</desc>
<defs>
